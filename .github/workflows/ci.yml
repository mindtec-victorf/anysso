name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Playwright + Chromium power the headless end-to-end tests. The real login-window test stays
      # off (ANYSSO_E2E_WINDOW unset): no interactive window in CI. Pure/unit tests run regardless.
      - run: npm install -g playwright@1.61.0
      - run: npx playwright@1.61.0 install chromium
      - run: npm test
